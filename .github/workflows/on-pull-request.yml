name: Pull request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Lint code
        run: bun format && bun lint:fix

      - uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: 'chore: format'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        run: bun run build

  package-types:
    name: Package types (TypeScript ${{ matrix.typescript-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        typescript-version: ['5.9.3', '6.0.3', '7.0.2']

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build permissionless
        run: bun run build:permissionless

      - name: Pack tarball into fixture
        working-directory: packages/permissionless
        run: npm pack --pack-destination ../../.github/fixtures/type-consumer

      - name: Copy type tests into fixture
        run: |
          rsync -a --prune-empty-dirs \
            --exclude node_modules --exclude _esm --exclude _types \
            --include '*/' --include '*.test-d.ts' --exclude '*' \
            packages/permissionless/ .github/fixtures/type-consumer/test-d/

      - name: Install fixture dependencies (TypeScript ${{ matrix.typescript-version }})
        working-directory: .github/fixtures/type-consumer
        run: |
          npm install --no-package-lock
          npm install --no-package-lock --no-save typescript@${{ matrix.typescript-version }} ./permissionless-*.tgz
          npx tsc --version

      - name: Type-check as a node10 consumer
        # TypeScript 7 removed node10; 6 keeps it behind ignoreDeprecations.
        if: matrix.typescript-version != '7.0.2'
        working-directory: .github/fixtures/type-consumer
        run: npx tsc -p tsconfig.node10.json ${{ startsWith(matrix.typescript-version, '6.') && '--ignoreDeprecations 6.0' || '' }}

      - name: Type-check as a node16 consumer
        working-directory: .github/fixtures/type-consumer
        run: npx tsc -p tsconfig.node16.json

      - name: Type-check as a nodenext consumer
        working-directory: .github/fixtures/type-consumer
        run: npx tsc -p tsconfig.nodenext.json

      - name: Type-check as a bundler consumer
        working-directory: .github/fixtures/type-consumer
        run: npx tsc -p tsconfig.bundler.json

      - name: Run the type tests against the tarball
        working-directory: .github/fixtures/type-consumer
        run: npx tsc -p tsconfig.test-d.json

      - name: Declaration probe (TS2742 / TS2883)
        working-directory: .github/fixtures/type-consumer
        run: npx tsc -p tsconfig.declaration.json

      - name: Declaration probe, extended clients (./_types/* escape hatch)
        working-directory: .github/fixtures/type-consumer
        run: npx tsc -p tsconfig.declaration.extend.json

      - name: Lint package publishing metadata
        if: matrix.typescript-version == '7.0.2'
        working-directory: packages/permissionless
        run: npx --yes publint --strict

      - name: Check published types resolve (ESM-only profile)
        if: matrix.typescript-version == '7.0.2'
        working-directory: packages/permissionless
        run: npx --yes @arethetypeswrong/cli --pack . --profile esm-only

  docker-e2e:
    name: E2E-Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          install-foundry: 'true'

      - uses: actions/setup-node@v6
        with:
          node-version: "v22.2.0"

      - name: Create .env file
        run: |
          echo "VITE_FORK_RPC_URL=${{ secrets.VITE_FORK_RPC_URL }}" > .env.test

      - name: Run tests & coverage
        run: bun run test:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  size:
    name: Size
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Report bundle size
        uses: andresz1/size-limit-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: bun
          build_script: build:size
